          point: [0.0, 0.05, 0.0]
          normal: [0.00011, 1.0, -0.00013]
        right:
          op: intersection
          left:
            type: plane
            point: [0.0, 0.0, 0.2]
            normal: [0.00011, -0.00013, 1.0]
          right:
