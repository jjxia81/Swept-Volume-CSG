type: csg
dimension: 3
root:
  op: intersection
  smooth_distance: 0.0  # Use 0.0 for hard union,
  transform:
    type: "compose"
    transforms:
      - type: "rotation"
        center: [0.0, 0.0, 0.0]
        axis: [0.013, 0.011, 1.0]
        angle: 180
      - type: "rotation"
        center: [-1.0, 0.013, 0.009]
        axis: [0.0, 1.0, 0.0]
        angle: 180
  left:
    op: intersection
    left:
      type: plane
      point: [-1.0, 0.25, 0]
      normal: [0.0, 1.0, 0.0]
    right:
      type: plane
      point: [-1.0, -0.25, 0]
      normal: [0.0, -1.0, 0.0]
  right:
    op: intersection
    left:
      op: intersection
      left:
        type: plane
        point: [-1.0, 0, 0.25]
        normal: [0.0, 0.0, 1.0]
        transform:
          type: compose
          transforms:
            - type: "translation"
              vector: [0.0, 0.0, -0.25]  
            - type: "rotation"
              axis: [0.23, 1.0, 0.17]
              angle: 0.0           
              center: [0.0, 0.0, 0.0] 
      right:
        type: plane
        point: [-1.0, 0, -0.25]
        normal: [0.0, 0.0, -1.0]
        transform:
          type: compose
          transforms:
            - type: "translation"
              vector: [0.0, 0.0, 0.25]  
            - type: "rotation"
              axis: [0.23, 1.0, 0.17]
              angle: 0.0           
              center: [0.0, 0.0, 0.0] 
    right:
      op: intersection
      left:
        type: plane
        point: [-0.75, 0.0, 0.0]
        normal: [1.0, 0.0, 0.0]
        transform:
          type: compose
          transforms:
            - type: "translation"
              vector: [-0.25, 0.0, 0.0]  
            - type: "rotation"
              axis: [0.23, 1.0, 0.17]
              angle: 0.0           
              center: [0.0, 0.0, 0.0] 
      right:
        type: plane
        point: [-1.25, 0.0, 0.0]
        normal: [-1.0, 0.0, 0.0]
        transform:
          type: compose
          transforms:
            - type: "translation"
              vector: [0.25, 0.0, 0.0]  
            - type: "rotation"
              axis: [0.23, 1.0, 0.17]
              angle: 0.0           
              center: [0.0, 0.0, 0.0] 
        
