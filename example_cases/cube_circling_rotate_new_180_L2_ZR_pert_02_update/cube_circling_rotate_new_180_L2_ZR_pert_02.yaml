type: csg
dimension: 3
root:
  op: intersection
  smooth_distance: 0.0  # Use 0.0 for hard union,
  transform:
    type: "compose"
    transforms:
      - type: "rotation"
        center: [0.0, 0.0, 0.0]
        axis: [0.013, 0.011, 1.0]
        angle: 180
      - type: "rotation"
        center: [-1.0, 0.013, 0.009]
        axis: [0.0, 1.0, 0.0]
        angle: 180
  left:
    op: intersection
    left:
      type: plane
      point: [-1.0, 0.3, 0]
      normal: [0.0, 1.0, 0.0]
    right:
      type: plane
      point: [-1.0, -0.3, 0]
      normal: [0.0, -1.0, 0.0]
  right:
    op: intersection
    left:
      op: intersection
      left:
        type: plane
        point: [-1.0, 0, 0.3]
        normal: [0.0, 0.0, 1.0]
      right:
        type: plane
        point: [-1.0, 0, -0.3]
        normal: [0.0, 0.0, -1.0]
    right:
      op: intersection
      left:
        type: plane
        point: [-0.7, 0.0, 0.0]
        normal: [1.0, 0.0, 0.0]
      right:
        type: plane
        point: [-1.3, 0.0, 0.0]
        normal: [-1.0, 0.0, 0.0]
