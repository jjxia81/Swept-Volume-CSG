type: csg
dimension: 3
root:
  op: intersection
  left:
    op: intersection
    left:
      op: intersection
      transform:
        type: compose
        transform:
        type: compose
        transforms:
          - type: translation
            # vector: [-1.0, 0.01, 0.03]
            vector: [0.0, 0.0, 0.0]
          - type: rotation
            axis: [0.013, -0.3, 0.5]
            angle: 0.0
            center: [0.0, 0.0, 0.0]
      left:
        transform:
          type: translation
          vector: [0.0, 0.0, -0.45]
        type: plane
        point: [0.0, 0.0, -0.16]
        normal: [0.017, -0.013, 1.0] 
      right:
        transform:
          type: translation
          vector: [0.0, 0.0, -0.45]
        type: plane
        point: [0.0, 0.0, -0.2]
        normal: [0.019, -0.011, -1.0]  
    right:
      op: intersection
      transform:
        type: compose
        transforms:
          - type: translation
            vector: [-1.0, 0.01, 0.03]
            # vector: [0.0, 0.0, 0.0]
          - type: rotation
            axis: [-0.09, -0.63, 0.41]
            angle: 360.0
            center: [0.0, 0.0, 0.0]
      left:
        negate: false
        type: ball
        center: [0.0, 0.0, 0.0]
        radius: 0.27  
      right:
        negate: true
        type: ball
        center: [0.0, 0.0, 0.0]
        radius: 0.215 
  
  right:
    op: intersection
    # left:
    #   op: intersection
    # transform:
    #   type: compose
    #   transforms:
    #     - type: translation
    #       vector: [-1.0, 0.01, 0.03]
    #       # vector: [0.0, 0.0, 0.0]
    #     - type: rotation
    #       axis: [-0.09, -0.63, 0.41]
    #       angle: 360.0
    #       center: [0.0, 0.0, 0.0]
    # left:
    #   op: intersection
    transform:
      type: compose
      transforms:
        - type: translation
          vector: [-1.0, 0.01, 0.03]
          # vector: [0.0, 0.0, 0.0]
        - type: rotation
          axis: [-0.09, -0.63, 0.41]
          angle: 360.0
          center: [0.0, 0.0, 0.0]
    left:
      op: intersection
      left:
        type: capsule
        negate: True
        radius: 0.17
        start: [-0.7, 0.0, 0.0]
        end: [0.7, 0.0, 0.0]
      right:
        type: capsule
        negate: True
        radius: 0.17
        start: [0.0, 0.0, -0.7]
        end: [0.0, 0.0, 0.7]
    right:
      type: capsule
      negate: True
      radius: 0.17
      start: [0.0, -0.7, 0.0]
      end: [0.0, 0.7, 0.0]
    
    